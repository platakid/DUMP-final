workflows:
  dump-ios-unsigned:
    name: DUMP - Unsigned device IPA (no signing, sign later yourself)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest

    scripts:
      - name: Reconstruct Xcode project
        script: |
          set -euo pipefail

          cd "$CM_BUILD_DIR"

          echo "Reconstructing DUMP.xcodeproj..."

          if [ ! -f "project.pbxproj" ]; then
            echo "ERROR: project.pbxproj not found."
            exit 1
          fi

          mkdir -p DUMP.xcodeproj/xcshareddata/xcschemes

          cp project.pbxproj DUMP.xcodeproj/project.pbxproj

          if [ -f "DUMP.xcscheme" ]; then
            cp DUMP.xcscheme \
              DUMP.xcodeproj/xcshareddata/xcschemes/DUMP.xcscheme
          fi

          echo "Xcode project structure:"
          find DUMP.xcodeproj -maxdepth 4 -type f -print

          echo "Checking Xcode project..."

          xcodebuild \
            -project DUMP.xcodeproj \
            -scheme DUMP \
            -resolvePackageDependencies

      - name: Check available schemes
        script: |
          set -euo pipefail

          cd "$CM_BUILD_DIR"

          echo "Available Xcode configuration:"
          xcodebuild \
            -project DUMP.xcodeproj \
            -list

      - name: Build DUMP
        script: |
          set -euo pipefail

          cd "$CM_BUILD_DIR"

          mkdir -p build/logs

          xcodebuild \
            -project DUMP.xcodeproj \
            -scheme DUMP \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build \
            | tee build/logs/build.log

      - name: Archive DUMP
        script: |
          set -euo pipefail

          cd "$CM_BUILD_DIR"

          mkdir -p build/ios
          mkdir -p build/logs

          xcodebuild archive \
            -project DUMP.xcodeproj \
            -scheme DUMP \
            -sdk iphoneos \
            -archivePath build/ios/DUMP.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            | tee build/logs/archive.log

      - name: Create unsigned IPA
        script: |
          set -euo pipefail

          cd "$CM_BUILD_DIR"

          APP_PATH="build/ios/DUMP.xcarchive/Products/Applications/DUMP.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: DUMP.app was not generated."

            echo "Available .app files:"
            find build -name "*.app" -print || true

            exit 1
          fi

          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload

          cp -R "$APP_PATH" \
            build/ios/ipa/Payload/DUMP.app

          cd build/ios/ipa

          zip -r DUMP-unsigned.ipa Payload

          echo ""
          echo "=============================="
          echo "IPA CREATED SUCCESSFULLY"
          echo "=============================="
          ls -lh DUMP-unsigned.ipa

    artifacts:
      - build/ios/ipa/*.ipa
      - build/logs/*.log
