workflows:
  dump-ios-unsigned:
    name: DUMP - Unsigned device IPA
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest

    scripts:
      - name: Prepare Xcode project structure
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          echo "Creating Xcode project..."

          # --------------------------------------------------
          # Reconstruct DUMP.xcodeproj
          # --------------------------------------------------

          mkdir -p DUMP.xcodeproj/xcshareddata/xcschemes

          cp project.pbxproj \
            DUMP.xcodeproj/project.pbxproj

          cp DUMP.xcscheme \
            DUMP.xcodeproj/xcshareddata/xcschemes/DUMP.xcscheme

          # --------------------------------------------------
          # Create directory structure expected by pbxproj
          # --------------------------------------------------

          mkdir -p DUMP/DUMP/Media
          mkdir -p DUMP/DUMP/Notes
          mkdir -p DUMP/DUMP/Security
          mkdir -p DUMP/DUMP/Storage
          mkdir -p DUMP/DUMP/UI

          # --------------------------------------------------
          # Main application files
          # --------------------------------------------------

          cp AppModel.swift DUMP/DUMP/AppModel.swift
          cp DUMPApp.swift DUMP/DUMP/DUMPApp.swift
          cp Info.plist DUMP/DUMP/Info.plist

          # --------------------------------------------------
          # Media
          # --------------------------------------------------

          cp MediaPreview.swift DUMP/DUMP/Media/MediaPreview.swift
          cp PhotosExporter.swift DUMP/DUMP/Media/PhotosExporter.swift
          cp PhotosImporter.swift DUMP/DUMP/Media/PhotosImporter.swift
          cp SecureCamera.swift DUMP/DUMP/Media/SecureCamera.swift
          cp SecureVideoContainer.swift DUMP/DUMP/Media/SecureVideoContainer.swift
          cp SecureVideoEncoder.swift DUMP/DUMP/Media/SecureVideoEncoder.swift
          cp SecureVideoPlayback.swift DUMP/DUMP/Media/SecureVideoPlayback.swift

          # --------------------------------------------------
          # Notes
          # --------------------------------------------------

          cp NoteEditor.swift DUMP/DUMP/Notes/NoteEditor.swift
          cp NotesStore.swift DUMP/DUMP/Notes/NotesStore.swift

          # --------------------------------------------------
          # Security
          # --------------------------------------------------

          cp Crypto.swift DUMP/DUMP/Security/Crypto.swift
          cp DeviceAuthentication.swift DUMP/DUMP/Security/DeviceAuthentication.swift
          cp KeychainStore.swift DUMP/DUMP/Security/KeychainStore.swift

          # --------------------------------------------------
          # Storage
          # --------------------------------------------------

          cp MediaStore.swift DUMP/DUMP/Storage/MediaStore.swift

          # --------------------------------------------------
          # UI
          # --------------------------------------------------

          cp RootView.swift DUMP/DUMP/UI/RootView.swift
          cp VaultView.swift DUMP/DUMP/UI/VaultView.swift

          # --------------------------------------------------
          # Create Assets.xcassets
          # --------------------------------------------------

          mkdir -p DUMP/DUMP/Assets.xcassets/AppIcon.appiconset

          cat > DUMP/DUMP/Assets.xcassets/Contents.json <<'EOF'
          {
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF

          cp Icon-1024.png \
            DUMP/DUMP/Assets.xcassets/AppIcon.appiconset/Icon-1024.png

          cat > DUMP/DUMP/Assets.xcassets/AppIcon.appiconset/Contents.json <<'EOF'
          {
            "images" : [
              {
                "filename" : "Icon-1024.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF

          echo "Project structure created."

          find DUMP -maxdepth 4 -type f -print

      - name: Resolve Swift packages
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          xcodebuild \
            -project DUMP.xcodeproj \
            -scheme DUMP \
            -resolvePackageDependencies

      - name: Build DUMP
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          mkdir -p build/logs

          xcodebuild \
            -project DUMP.xcodeproj \
            -scheme DUMP \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build \
            | tee build/logs/build.log

      - name: Archive DUMP
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          mkdir -p build/ios
          mkdir -p build/logs

          xcodebuild archive \
            -project DUMP.xcodeproj \
            -scheme DUMP \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/ios/DUMP.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            | tee build/logs/archive.log

      - name: Create unsigned IPA
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          APP="build/ios/DUMP.xcarchive/Products/Applications/DUMP.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: DUMP.app was not produced."
            find build -name "*.app" -print || true
            exit 1
          fi

          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload

          cp -R "$APP" build/ios/ipa/Payload/DUMP.app

          cd build/ios/ipa

          zip -r DUMP-unsigned.ipa Payload

          echo "================================"
          echo "DUMP-unsigned.ipa CREATED"
          echo "================================"

          ls -lh DUMP-unsigned.ipa

    artifacts:
      - build/ios/ipa/DUMP-unsigned.ipa
      - build/logs/*.log
